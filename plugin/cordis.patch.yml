# jg-material-studio 的 插件 Bundle 装配层。
# 只插入一行：材质工作台插件。它的模型由中枢统一提供，不在插件里存密钥。
# 部署侧需要提供的两条：appRoot（材质应用根目录）与 upstreamKeyEnv 指向的环境变量。
- insert:
    - id: material-studio
      name: '@jg/jg-material-studio'
      config:
        appRoot: !!js process.env.JG_MATERIAL_APP_ROOT ?? ''
        launcher: scripts/launch-local.mjs
        proxyScript: plugin/model-proxy.mjs
        proxyPort: 4198
        upstreamBaseURL: !!js process.env.JG_MATERIAL_UPSTREAM ?? 'https://dashscope.aliyuncs.com/compatible-mode/v1'
        upstreamKeyEnv: JG_MODEL_API_KEY
        models:
          - id: qwen3.8-max
            kind: recognition
            display: 企业内部中枢 · 企业模型
          - id: qwen3.8-max
            kind: discovery
            display: 企业内部中枢 · 区域发现
